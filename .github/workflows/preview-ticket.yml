name: request-preview-ticket

# Called by each service repository. Resolve the PR's ticket, then hand the work to
# bluejay-github-actions so sibling repositories share one concurrency queue per ticket.
on:
  workflow_call:
    inputs:
      repo:   { required: true, type: string }
      pr:     { required: true, type: string }
      action: { required: true, type: string }
    secrets:
      RAILWAY_TOKEN: { required: false }
      PREVIEW_GH_TOKEN: { required: true }
      LINEAR_API_KEY: { required: false }

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one serialized preview run
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9._-]+$ && "$PR" =~ ^[0-9]+$ ]] || { echo "::error::invalid repository or PR in preview request"; exit 1; }
          title=$(gh pr view "$PR" -R "bluejay-ai-dev/$REPO" --json title -q .title)
          ticket=$(grep -oiE '\b[A-Z]+-[0-9]+\b' <<<"$title" | head -1 | tr '[:lower:]' '[:upper:]' || true)
          [ -n "$ticket" ] || { echo "no ticket id in the PR title; skipping"; exit 0; }

          payload=$(jq -nc --arg repo "$REPO" --arg pr "$PR" --arg action "$ACTION" --arg ticket "$ticket" \
            '{event_type:"preview-ticket",client_payload:{repo:$repo,pr:$pr,action:$action,ticket:$ticket}}')
          curl -fsS --max-time 20 -X POST \
            https://api.github.com/repos/bluejay-ai-dev/bluejay-github-actions/dispatches \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "$payload" >/dev/null
          echo "queued $ticket preview work in bluejay-github-actions"
