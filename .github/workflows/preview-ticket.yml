name: preview-ticket

# One preview per TICKET, not per PR.
#
# Railway's own PR Environments make one environment per pull request, so a ticket spanning
# middleware and frontend gets two, each holding half the change, and two links. This makes
# a single environment per ticket with every sibling PR's branch checked out, and repos the
# ticket does not touch left on main. One link, the whole feature, prod-shaped.
#
# Gated on a label so it only runs for PRs that ask for it. Railway's automatic PR
# Environments should be OFF, or you get both.

on:
  workflow_call:
    inputs:
      repo:    { required: true, type: string }
      pr:      { required: true, type: string }
      action:  { required: true, type: string }
    secrets:
      RAILWAY_TOKEN:   { required: true }
      PREVIEW_GH_TOKEN: { required: true }
      LINEAR_API_KEY:  { required: false }

permissions:
  contents: read

env:
  ORG: bluejay-ai-dev
  PROJECT: 7047af18-477f-42e0-a905-f2e8f7ccac0f
  BASE_ENV: preview-base
  BASE_ENV_ID: 0a1b75a1-8402-418a-8192-00fe1613ec14
  LABEL: preview
  # Repos that are Railway services in preview-base. Others are lambdas, handled by
  # preview-lambda.yml, or have no preview surface at all.
  RAILWAY_REPOS: bluejay_middleware:middleware bluejay_frontend_v2:frontend

jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the ticket and whether it wants a preview
        id: t
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          title=$(gh pr view "$PR" -R "$ORG/$REPO" --json title -q .title)
          ticket=$(grep -oiE '\b[A-Z]+-[0-9]+\b' <<<"$title" | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$ticket" ]; then
            echo "no ticket id in the title, nothing to group"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          echo "env_name=preview-$(tr '[:upper:]' '[:lower:]' <<<"$ticket")" >> "$GITHUB_OUTPUT"

          # A ticket keeps its preview while ANY of its PRs still carries the label. One PR
          # closing or losing the label must not pull the environment out from under the rest.
          want=0
          for entry in $RAILWAY_REPOS; do
            r=${entry%%:*}
            for n in $(gh pr list -R "$ORG/$r" --state open --search "$ticket in:title" --limit 10 --json number -q '.[].number'); do
              if gh pr view "$n" -R "$ORG/$r" --json labels -q '[.labels[].name]|join(",")' | grep -q "$LABEL"; then
                want=1
              fi
            done
          done
          echo "want=$want" >> "$GITHUB_OUTPUT"

      - name: Install the Railway CLI and link the project
        if: steps.t.outputs.skip != '1'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @railway/cli >/dev/null 2>&1
          # `railway environment` takes no --project, it reads the linked one, and
          # `railway link` needs a user the team token does not have. The link file is
          # just ids, so write it.
          mkdir -p ~/.railway
          jq -n --arg d "$PWD" --arg p "$PROJECT" --arg e "$BASE_ENV_ID" --arg n "$BASE_ENV" \
            '{projects:{($d):{projectPath:$d,name:"Bluejay",project:$p,environment:$e,environmentName:$n,service:null}}}' \
            > ~/.railway/config.json
          railway environment list >/dev/null

      - name: Tear the ticket's preview down
        if: steps.t.outputs.skip != '1' && steps.t.outputs.want == '0'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ steps.t.outputs.env_name }}
        run: |
          set -uo pipefail
          if railway environment list 2>/dev/null | grep -q "$ENV_NAME"; then
            railway environment delete "$ENV_NAME" --yes >/dev/null 2>&1 \
              && echo "deleted $ENV_NAME" || echo "::warning::could not delete $ENV_NAME"
          else
            echo "$ENV_NAME does not exist, nothing to tear down"
          fi

      - name: Build or refresh the ticket's preview
        id: up
        if: steps.t.outputs.skip != '1' && steps.t.outputs.want == '1'
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          TICKET: ${{ steps.t.outputs.ticket }}
          ENV_NAME: ${{ steps.t.outputs.env_name }}
        run: |
          set -uo pipefail
          # Each Railway service points at its own repo's PR branch for this ticket, or stays
          # on main when the ticket does not touch that repo. That is the shared baseline.
          args=()
          touched=""
          for entry in $RAILWAY_REPOS; do
            r=${entry%%:*}; svc=${entry##*:}
            br=$(gh pr list -R "$ORG/$r" --state open --search "$TICKET in:title" --limit 10 \
                 --json number,title,headRefName \
                 -q "first(.[] | select(.title | test(\"(^|[^A-Za-z0-9])$TICKET([^0-9]|\$)\";\"i\")) | .headRefName) // \"\"")
            [ -n "$br" ] || { echo "$r: main (untouched)"; continue; }
            echo "$r: $br"
            args+=(--service-config "$svc" source.branch "$br")
            touched="$touched $r"
          done
          [ -n "$touched" ] || { echo "::error::$TICKET has no open PR in a Railway-backed repo"; exit 1; }

          # Recreate rather than patch: one command sets every branch atomically, and a
          # preview is disposable so there is nothing worth preserving across a refresh.
          railway environment delete "$ENV_NAME" --yes >/dev/null 2>&1 || true
          railway environment new "$ENV_NAME" --duplicate "$BASE_ENV" "${args[@]}" \
            || { echo "::error::could not create $ENV_NAME"; exit 1; }

          # Lambdas are deployed per PR by preview-lambda.yml; point this environment at them.
          for pair in evals:LAMBDA_FUNCTION_NAME:evaluator text_agent:TEXT_AGENT_LAMBDA_FUNCTION_NAME:text_agent; do
            lr=${pair%%:*}; rest=${pair#*:}; key=${rest%%:*}; base=${rest##*:}
            n=$(gh pr list -R "$ORG/$lr" --state open --search "$TICKET in:title" --limit 5 --json number -q 'first(.[].number) // ""')
            [ -n "$n" ] || continue
            railway variable set --service middleware --environment "$ENV_NAME" --project "$PROJECT" \
              --skip-deploys "$key=pr${n}_$base" >/dev/null 2>&1 \
              && echo "$lr: pr${n}_$base" || echo "::warning::could not point $key at pr${n}_$base"
          done

          url=$(railway domain list --service frontend --environment "$ENV_NAME" --json 2>/dev/null \
                | jq -r 'first(.domains[].domain) // ""')
          [ -z "$url" ] || url="https://$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          echo "preview: $url"

      - name: Post the one link on every PR of the ticket, and on Linear
        if: steps.t.outputs.skip != '1' && steps.t.outputs.want == '1' && steps.up.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TICKET: ${{ steps.t.outputs.ticket }}
          URL: ${{ steps.up.outputs.url }}
          TOUCHED: ${{ steps.up.outputs.touched }}
        run: |
          set -uo pipefail
          body=":rocket: **Preview for $TICKET** · $URL"
          body="$body"$'\n\n'"Every PR on this ticket is in it. Repos the ticket does not touch run \`main\`."
          body="$body"$'\n'"Changed here:$TOUCHED. Data is the shared sandbox, not production."
          body="$body"$'\n'"It is rebuilt on every push and deleted when the last labelled PR closes."

          # One comment per PR, replacing our own previous one so pushes do not pile up.
          for entry in $RAILWAY_REPOS evals:x text_agent:x livekit_dispatcher:x; do
            r=${entry%%:*}
            for n in $(gh pr list -R "$ORG/$r" --state open --search "$TICKET in:title" --limit 10 --json number -q '.[].number'); do
              old=$(gh api "repos/$ORG/$r/issues/$n/comments" \
                    -q "first(.[] | select(.body | startswith(\":rocket: **Preview for\")) | .id) // \"\"" 2>/dev/null)
              [ -n "$old" ] && gh api -X DELETE "repos/$ORG/$r/issues/comments/$old" >/dev/null 2>&1
              gh pr comment "$n" -R "$ORG/$r" --body "$body" >/dev/null 2>&1 && echo "commented $r#$n"
            done
          done

          [ -n "${LINEAR_API_KEY:-}" ] || { echo "no LINEAR_API_KEY, skipping the Linear link"; exit 0; }
          # attachmentCreate is idempotent on url, so a rebuild updates rather than duplicates.
          q='mutation($i:String!,$u:String!,$t:String!){attachmentCreate(input:{issueId:$i,url:$u,title:$t}){success}}'
          resp=$(curl -fsS --max-time 20 https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" -H 'content-type: application/json' \
            -d "$(jq -nc --arg q "$q" --arg i "$TICKET" --arg u "$URL" --arg t "Preview" \
                  '{query:$q,variables:{i:$i,u:$u,t:$t}}')" 2>/dev/null)
          if grep -q '"success":true' <<<"${resp:-}"; then echo "attached to $TICKET"
          else echo "::warning::could not attach the preview to $TICKET: ${resp:0:160}"; fi
