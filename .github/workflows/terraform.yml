name: terraform

# fmt and validate on every event, a plan per environment on PRs, apply on main.
# The plan role is read-only and trusts the pull_request OIDC subject. The apply role
# trusts only refs/heads/main.

on:
  workflow_call:
    inputs:
      working_directory: { required: false, type: string, default: infra/terraform }
      terraform_version: { required: false, type: string, default: 1.11.4 }
      aws_region: { required: false, type: string, default: us-west-1 }
      environments: { required: true, type: string }

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate
        run: |
          set -euo pipefail
          [ -f .terraform.lock.hcl ] || { echo "::error::.terraform.lock.hcl is missing. Run terraform init and commit it."; exit 1; }
          terraform fmt -check -recursive || { echo "::error::run terraform fmt -recursive"; exit 1; }
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

  plan:
    # Fork PRs get no OIDC token and a read-only GITHUB_TOKEN, so they only validate.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: tf-plan-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ inputs.working_directory }}-${{ matrix.env.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.environments) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      ENV_NAME: ${{ matrix.env.name }}
      VAR_FILE: ${{ matrix.env.var_file }}
      BACKEND_CONFIG: ${{ matrix.env.backend_config }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env.plan_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Init
        run: |
          set -euo pipefail
          args=()
          [ -z "$BACKEND_CONFIG" ] || args+=("-backend-config=$BACKEND_CONFIG")
          terraform init -input=false -lockfile=readonly "${args[@]}"

      - name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WORKDIR: ${{ inputs.working_directory }}
        run: |
          set -uo pipefail
          args=()
          [ -z "$VAR_FILE" ] || args+=("-var-file=$VAR_FILE")
          # The plan role cannot write the .tflock object, hence -lock=false. Exit 2 means changes.
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          set -e
          case $code in
            0) status="No changes" ;;
            2) status="Changes" ;;
            *) status="Failed" ;;
          esac

          # GitHub rejects comments over 65536 characters; bytes never undercount them.
          marker="<!-- terraform-plan $WORKDIR $ENV_NAME -->"
          size=$(wc -c < "$RUNNER_TEMP/plan.txt")
          body="$RUNNER_TEMP/body.md"
          {
            echo "$marker"
            echo "### Terraform plan \`$ENV_NAME\` ($WORKDIR): $status"
            grep -E '^(Plan:|No changes\.)' "$RUNNER_TEMP/plan.txt" | tail -n 1 || true
            echo
            echo '```text'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo
            echo '```'
            [ "$size" -le 60000 ] || echo "Truncated at 60000 of $size bytes. The full plan is in the job log."
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            | jq -rs --arg m "$marker" 'add | map(select(.user.login == "github-actions[bot]" and (.body | startswith($m)))) | .[0].id // empty') \
            || { echo "::error::could not list PR comments"; exit 1; }
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
          fi || { echo "::error::could not post the plan comment"; exit 1; }

          [ "$status" != Failed ] || exit 1

  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: terraform-apply-${{ github.repository }}-${{ inputs.working_directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      # One job loops the environments because matrix jobs have no guaranteed run order.
      # configure-aws-credentials cannot run per iteration, so each role is assumed here.
      - name: Apply
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          get() { jq -r --argjson i "$i" --arg k "$1" '.[$i][$k] // ""' <<<"$ENVIRONMENTS"; }
          n=$(jq length <<<"$ENVIRONMENTS")
          for ((i = 0; i < n; i++)); do
            name=$(get name)
            role=$(get apply_role_arn)
            var_file=$(get var_file)
            backend=$(get backend_config)
            echo "::group::apply $name"

            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
            echo "::add-mask::$token"
            creds=$(aws sts assume-role-with-web-identity --role-arn "$role" \
              --role-session-name "GitHubActions-$GITHUB_RUN_ID" --web-identity-token "$token" \
              --query Credentials --output json)
            AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")
            AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")
            AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")
            echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
            echo "::add-mask::$AWS_SESSION_TOKEN"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN

            args=()
            [ -z "$backend" ] || args+=("-backend-config=$backend")
            terraform init -input=false -lockfile=readonly -reconfigure "${args[@]}"
            args=()
            [ -z "$var_file" ] || args+=("-var-file=$var_file")
            terraform plan -input=false -no-color -out=tfplan "${args[@]}"
            terraform apply -input=false -no-color tfplan
            echo "::endgroup::"
          done
