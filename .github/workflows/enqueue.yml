name: enqueue

# Merge every PR on a ticket, in the order .release/order.yml declares, or none of them.
# Manual only: nothing merges because someone pushed.
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Ticket id, e.g. ENG-123'
        required: true
      check_only:
        description: 'Report what would happen and merge nothing'
        type: boolean
        default: false

# Queue, never cancel. A cancelled run can leave half a batch on main.
concurrency:
  group: enqueue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate the ticket
        env:
          TICKET: ${{ inputs.ticket }}
        run: |
          # Caller input reaches gh and git below, so it is matched, never interpolated.
          [[ "$TICKET" =~ ^ENG-[0-9]+$ ]] || { echo "::error::not a ticket id: $TICKET"; exit 2; }
          echo "TICKET=$TICKET" >> "$GITHUB_ENV"

      # A token that can merge into protected main. The App is the only bypass actor.
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Enqueue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ github.repository_owner }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            bin/enqueue.sh check "$TICKET" | tee /tmp/enqueue.log
          else
            bin/enqueue.sh run "$TICKET" | tee /tmp/enqueue.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        run: sed -n '1,80p' /tmp/enqueue.log >> "$GITHUB_STEP_SUMMARY" || true
