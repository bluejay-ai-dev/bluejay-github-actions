name: pr-checks

# Reusable. App repos call it from their own thin wrapper, which is what keeps the
# scripts in one place instead of copied into seven repos.
on:
  workflow_call:
    inputs:
      # build is red in several repos for reasons no PR introduced, a Dockerfile apt
      # step among them. Opt in per repo once it passes there, rather than blocking
      # every PR in the org on it.
      heavy:
        description: 'Also run the docker/npm build'
        type: boolean
        default: false
    secrets:
      SANDBOX_GH_TOKEN: { required: true }
      LINEAR_API_KEY:   { required: true }
      RAILWAY_TOKEN:    { required: false }
      INFISICAL_TOKEN:  { required: false }

permissions:
  contents: read
  pull-requests: read

env:
  OWNER: ${{ github.repository_owner }}

jobs:
  ticket:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.parse.outputs.id }}
    steps:
      - id: parse
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          id=$(grep -oiE 'ENG-[0-9]+' <<<"$TITLE" | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$id" ]; then
            echo "::error::PR title must contain a ticket id, e.g. ENG-123 short description"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "ticket id: $id" >> "$GITHUB_STEP_SUMMARY"

  description:
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # python, not sed: stripping html comments needs a lazy quantifier, which POSIX
          # ERE does not have, and the sed version measured every body as empty.
          chars=$(python3 -c 'import os,re; b=re.sub(r"<!--.*?-->","",os.environ.get("BODY",""),flags=re.S); print(len(re.sub(r"\s","",b)))')
          if [ "$chars" -lt 30 ]; then
            echo "::error::PR description is empty or boilerplate ($chars real characters)."
            echo "::error::Say what changed and why, in a couple of terse lines. Not the incident, not a test plan."
            exit 1
          fi
          echo "description: $chars characters" >> "$GITHUB_STEP_SUMMARY"

  visuals:
    runs-on: ubuntu-latest
    # `no-visual` is the release valve for a change with genuinely nothing to look at,
    # a migration or a CI tweak. It is a label so the reason is visible on the PR.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-visual') }}
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # cubic appends its own block with an <img> review button. Counting that as
          # the author's screenshot passed this check on every cubic-reviewed PR.
          b=$(python3 -c 'import os,re; print(re.sub(r"<!-- This is an auto-generated description by cubic\. -->.*?<!-- End of auto-generated description by cubic\. -->","",os.environ.get("BODY",""),flags=re.S))')
          # markdown image, html img/video, or a github attachment link
          if grep -qiE '!\[[^]]*\]\([^)]+\)|<img |<video |user-attachments/assets/|githubusercontent\.com' <<<"$b"; then
            echo "visuals: found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::No screenshot or video in the PR description."
          echo "::error::Drag an image or screen recording into the body. Nothing to show? Add the 'no-visual' label."
          exit 1

  ticket-hygiene:
    needs: ticket
    runs-on: ubuntu-latest
    steps:
      - env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ID: ${{ needs.ticket.outputs.id }}
        run: |
          set -euo pipefail
          # Fail closed. An unset key used to make this pass while checking nothing.
          [ -n "${LINEAR_API_KEY:-}" ] || { echo "::error::LINEAR_API_KEY is not set, so the ticket cannot be checked"; exit 1; }
          q='query($i:String!){issue(id:$i){identifier title description assignee{name} state{name}}}'
          resp=$(curl -fsS --max-time 20 https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" -H 'content-type: application/json' \
            -d "$(jq -nc --arg q "$q" --arg i "$ID" '{query:$q,variables:{i:$i}}')") \
            || { echo "::error::could not reach Linear"; exit 1; }
          jq -e '.data.issue' >/dev/null <<<"$resp" || { echo "::error::$ID does not exist in Linear"; exit 1; }

          bad=0
          # "How we ship v2-2": the ticket must exist and not be Done or Canceled. A PR
          # against a closed ticket means the ticket is wrong or the PR is.
          state=$(jq -r '.data.issue.state.name' <<<"$resp")
          case "$state" in
            Done|Canceled|Duplicate)
              echo "::error::$ID is $state. Reopen it or point the PR at the right ticket."; bad=1 ;;
          esac
          desc=$(jq -r '.data.issue.description // ""' <<<"$resp" | tr -d '[:space:]' | wc -c | tr -d ' ')
          [ "$desc" -ge 20 ] || { echo "::error::$ID has no description. Say what the issue is and what to do."; bad=1; }
          jq -e '.data.issue.assignee' >/dev/null <<<"$resp" \
            || { echo "::error::$ID is unassigned."; bad=1; }
          {
            echo "ticket: $ID"
            echo "state: $(jq -r '.data.issue.state.name' <<<"$resp")"
            echo "assignee: $(jq -r '.data.issue.assignee.name // "none"' <<<"$resp")"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $bad

  build:
    if: inputs.heavy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f Dockerfile ]; then docker build -q -t check .; else echo "no Dockerfile"; fi
      - env:
          # npm ci triggers a prisma generate postinstall in some repos, which throws on a
          # missing DIRECT_URL before any build step runs.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          DIRECT_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
            npm test --if-present
          else
            echo "no package.json"
          fi

  # codegen runs the repo's own generator, and a same-repo PR controls that script.
  # It therefore gets its own job with NO secrets: anything it can reach, a PR author
  # can reach. The credentialed steps stay in `deterministic`.
  codegen:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluejay-ai-dev/bluejay-github-actions
          ref: ${{ github.job_workflow_sha }}
          path: .gating
      - run: .gating/bin/checks.sh codegen

  deterministic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
      TITLE: ${{ github.event.pull_request.title }}
      BODY: ${{ github.event.pull_request.body }}
      ADDITIONS: ${{ github.event.pull_request.additions }}
      GH_TOKEN: ${{ secrets.SANDBOX_GH_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROD_SERVICE: ${{ vars.RAILWAY_PROD_SERVICE }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # prisma.config resolves DIRECT_URL too and throws if it is unset, even though
      # generate never connects. Same throwaway postgres as above.
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      INFISICAL_DEB_SHA256: 43e5c251ce5ba078f3751f76971a816f7b9f99c2fe4a938848af5cf5b087bf3c
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The scripts must come from THIS repo at the same commit as this workflow, not
      # from the PR: a reusable workflow's default checkout is the caller, and the PR
      # could otherwise edit checks.sh and read every secret below.
      - uses: actions/checkout@v4
        with:
          repository: bluejay-ai-dev/bluejay-github-actions
          ref: ${{ github.job_workflow_sha }}
          path: .gating
      # env-vars fails closed without this, so it is a dependency rather than a nicety.
      - name: Install infisical
        if: env.INFISICAL_TOKEN != ''
        run: |
          curl -fsSL -o /tmp/infisical.deb \
            https://github.com/Infisical/infisical/releases/download/infisical-cli%2Fv0.41.90/infisical_0.41.90_linux_amd64.deb
          echo "$INFISICAL_DEB_SHA256  /tmp/infisical.deb" | sha256sum -c -
          sudo dpkg -i /tmp/infisical.deb >/dev/null
      - { if: always(), name: ticket-sane,           run: .gating/bin/checks.sh ticket-sane }
      - { if: always(), name: video,                 run: .gating/bin/checks.sh video }
      - { if: always(), name: migrations-immutable,  run: .gating/bin/checks.sh migrations-immutable }
      - { if: always(), name: migrations-newest,     run: .gating/bin/checks.sh migrations-newest }
      - { if: always(), name: migrations-have-down,  run: .gating/bin/checks.sh migrations-have-down }
      - { if: always(), name: migrations-round-trip, run: .gating/bin/checks.sh migrations-round-trip }
      - { if: always(), name: rls,                   run: .gating/bin/checks.sh rls }
      - { if: always(), name: env-vars,              run: .gating/bin/checks.sh env-vars }
      - { if: always(), name: deps-bounded,          run: .gating/bin/checks.sh deps-bounded }