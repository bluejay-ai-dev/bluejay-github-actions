name: preview-lambda

# Deploys a PR's lambda so a preview runs the code in the PR, not the shared sandbox copy.
#
# One function per PR, cloned from the matching sandbox function. Lambda bills per
# invocation, so an idle preview function costs nothing, which is why this is a function
# per PR rather than aliases over a shared one. Publishing versions of the shared function
# would mean writing to its $LATEST, and a preview must never disturb sandbox.
#
# Outputs the function name so the caller can hand it to the preview environment as
# LAMBDA_FUNCTION_NAME or TEXT_AGENT_LAMBDA_FUNCTION_NAME.

on:
  workflow_call:
    inputs:
      repo:      { required: true, type: string }   # calling repo, e.g. evals
      pr:        { required: true, type: string }
      sha:       { required: true, type: string }
      action:    { required: true, type: string }   # opened/synchronize/closed
    secrets:
      RAILWAY_TOKEN:    { required: true }
      PREVIEW_GH_TOKEN: { required: true }
    outputs:
      function:
        description: 'The PR lambda, empty when torn down or not applicable'
        value: ${{ jobs.deploy.outputs.function }}

permissions:
  contents: read
  id-token: write


jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      function: ${{ steps.out.outputs.function }}
    steps:
      # Same `preview` label as preview-ticket.yml. Without this a lambda repo would
      # build and push an image on every PR, which is the half that costs money.
      - name: Does this PR want a preview
        id: gate
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          read -r base has < <(gh pr view "$PR" -R "bluejay-ai-dev/$REPO" --json baseRefName,labels \
                -q '"\(.baseRefName) \([.labels[].name] | index("preview") // "no")"')
          # closed always runs, so a teardown still removes the function whatever the base.
          if [ "$ACTION" = closed ] || [ "$base" = main ] || [ "$has" != no ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "not a PR to main and no preview label, nothing to build"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          repository: bluejay-ai-dev/${{ inputs.repo }}
          ref: ${{ inputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.go == '1'
        with:
          role-to-assume: arn:aws:iam::148660429236:role/bluejay-preview-ci
          aws-region: ${{ steps.names.outputs.region || 'us-west-1' }}

      - name: Resolve names
        id: names
        if: steps.gate.outputs.go == '1'
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::bad pr number"; exit 1; }
          # The repo is not the lambda: evals deploys as evaluator.
          # base, the function cloned from, its ECR repo, and the region. emails-lambda is
          # the odd one: us-east-1, dev-/prod- naming, and an unprefixed ECR repo.
          case "$REPO" in
            evals)              base=evaluator;          src=sandbox_evaluator;          ecr=sandbox_evaluator;          region=us-west-1 ;;
            text_agent)         base=text_agent;         src=sandbox_text_agent;         ecr=sandbox_text_agent;         region=us-west-1 ;;
            livekit_dispatcher) base=livekit_dispatcher; src=sandbox_livekit_dispatcher; ecr=sandbox_livekit_dispatcher; region=us-west-1 ;;
            emails-lambda)      base=email;              src=dev-email;                  ecr=bluejay-email-lambda;       region=us-east-1 ;;
            *) echo "no lambda for $REPO"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          {
            echo "base=$base"
            echo "src=$src"
            echo "fn=pr${PR}_$base"
            echo "ecr=$ecr"
            echo "region=$region"
          } >> "$GITHUB_OUTPUT"

      - name: Tear down
        if: steps.gate.outputs.go == '1' && steps.names.outputs.skip != '1' && inputs.action == 'closed'
        env:
          FN: ${{ steps.names.outputs.fn }}
          ECR: ${{ steps.names.outputs.ecr }}
          AWS_DEFAULT_REGION: ${{ steps.names.outputs.region }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          aws lambda delete-function --function-name "$FN" 2>/dev/null && echo "deleted $FN" || echo "$FN was not there"
          aws ecr batch-delete-image --repository-name "$ECR" --image-ids "imageTag=pr-$PR" >/dev/null 2>&1 || true

      - name: Build, push and deploy
        if: steps.gate.outputs.go == '1' && steps.names.outputs.skip != '1' && inputs.action != 'closed'
        env:
          SRC: ${{ steps.names.outputs.src }}
          FN: ${{ steps.names.outputs.fn }}
          ECR: ${{ steps.names.outputs.ecr }}
          REGION: ${{ steps.names.outputs.region }}
          AWS_DEFAULT_REGION: ${{ steps.names.outputs.region }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          acct=148660429236
          registry="$acct.dkr.ecr.$REGION.amazonaws.com"
          uri="$registry/$ECR:pr-$PR"

          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" >/dev/null

          # The sandbox functions are arm64, so the image has to be too or the function
          # fails at first invoke rather than at deploy.
          docker buildx create --use --name preview >/dev/null 2>&1 || docker buildx use preview
          docker buildx build --platform linux/arm64 -t "$uri" --push . \
            || { echo "::error::image build failed"; exit 1; }

          # Clone the sandbox function's shape so the preview behaves like sandbox: same
          # role, memory, timeout and variables. Only the image differs.
          cfg=$(aws lambda get-function-configuration --function-name "$SRC")
          role=$(jq -r .Role <<<"$cfg")
          timeout=$(jq -r .Timeout <<<"$cfg")
          mem=$(jq -r .MemorySize <<<"$cfg")
          jq -c '{Variables: (.Environment.Variables // {})}' <<<"$cfg" > env.json

          if aws lambda get-function --function-name "$FN" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FN" --image-uri "$uri" >/dev/null
            aws lambda wait function-updated --function-name "$FN"
            aws lambda update-function-configuration --function-name "$FN" \
              --timeout "$timeout" --memory-size "$mem" --environment "file://env.json" >/dev/null
          else
            aws lambda create-function --function-name "$FN" \
              --package-type Image --code "ImageUri=$uri" --role "$role" \
              --architectures arm64 --timeout "$timeout" --memory-size "$mem" \
              --environment "file://env.json" \
              --tags "bluejay:preview-pr=$PR,bluejay:preview-repo=${{ inputs.repo }}" >/dev/null
          fi
          aws lambda wait function-active-v2 --function-name "$FN"
          echo "deployed $FN from $uri"

      # An evals PR creates no Railway environment of its own: evals is not a Railway
      # service. The preview that should use this lambda is the one belonging to the
      # ticket's middleware PR, so find it by ticket and override the one variable.
      - name: Point the ticket's preview at this lambda
        if: steps.gate.outputs.go == '1' && steps.names.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_GH_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          FN: ${{ steps.names.outputs.fn }}
          BASE: ${{ steps.names.outputs.base }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          ACTION: ${{ inputs.action }}
        run: |
          set -uo pipefail
          title=$(gh pr view "$PR" -R "bluejay-ai-dev/$REPO" --json title -q .title 2>/dev/null || true)
          ticket=$(grep -oiE '\b[A-Z]+-[0-9]+\b' <<<"$title" | head -1 | tr '[:lower:]' '[:upper:]')
          [ -n "$ticket" ] || { echo "no ticket in the title, nothing to wire"; exit 0; }

          env_name="preview-$(tr '[:upper:]' '[:lower:]' <<<"$ticket")"
          # Which variable middleware reads depends on which lambda this is.
          case "$BASE" in
            evaluator)  key=LAMBDA_FUNCTION_NAME ;;
            text_agent) key=TEXT_AGENT_LAMBDA_FUNCTION_NAME ;;
            *) echo "no middleware variable maps to $BASE"; exit 0 ;;
          esac

          # On close, hand it back to the shared sandbox copy rather than a deleted function.
          value="$FN"
          [ "$ACTION" = closed ] && value="sandbox_$BASE"

          npm i -g @railway/cli >/dev/null 2>&1
          # Same link-file trick as preview-ticket.yml: the CLI needs a linked project and
          # `railway link` cannot authenticate a team token.
          mkdir -p ~/.railway
          jq -n --arg d "$PWD" --arg p 7047af18-477f-42e0-a905-f2e8f7ccac0f \
            '{projects:{($d):{projectPath:$d,name:"Bluejay",project:$p,environment:"0a1b75a1-8402-418a-8192-00fe1613ec14",environmentName:"preview-base",service:null}},
              user:{id:"",token:null,accessToken:null,refreshToken:null,tokenExpiresAt:0}}' \
            > ~/.railway/config.json
          if railway variable set --service middleware --environment "$env_name" --skip-deploys "$key=$value" >/dev/null 2>&1; then
            echo "$env_name: $key=$value"
          else
            echo "::warning::could not set $key on $env_name; the preview will use the shared lambda"
          fi

      - name: Output
        id: out
        env:
          FN: ${{ steps.names.outputs.fn }}
        run: |
          if [ "${{ steps.gate.outputs.go }}" != "1" ] || [ "${{ steps.names.outputs.skip }}" = "1" ] || [ "${{ inputs.action }}" = "closed" ]; then
            echo "function=" >> "$GITHUB_OUTPUT"
          else
            echo "function=$FN" >> "$GITHUB_OUTPUT"
          fi
