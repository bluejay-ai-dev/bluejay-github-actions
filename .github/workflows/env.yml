name: env

# Called by preview.yml, and later by queue.yml. Points every service in the
# stack at the ticket's image where the ticket has an open PR in that repo, and
# at the image production is already running where it does not.
on:
  workflow_call:
    inputs:
      name:
        description: environment name, e.g. preview-ENG-123
        required: true
        type: string
      tickets:
        description: space separated ticket ids
        required: true
        type: string
    outputs:
      frontend_url:
        value: ${{ jobs.up.outputs.frontend_url }}

# Least privilege: this reads the repo and talks to Railway and GHCR with their own
# tokens. Without this block it inherits the repo default, which can be write-all.
permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.up.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lorenzotaylor-bluejay/shipflow-ci
          token: ${{ secrets.SANDBOX_GH_TOKEN }}
      - id: up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ secrets.SANDBOX_GH_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          NAME: ${{ inputs.name }}
          TICKETS: ${{ inputs.tickets }}
        run: bin/env.sh up "$NAME" "$TICKETS"
